<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<title>Math Board — Zigzag Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>

:root{
  --neon:#00ff88; --cyan:#00ffff; --orange:#ffaa00; --red:#ff2244;
  --p1:#3b9dff; --p2:#ff4dd2;
  --ink:#e9fff5; --ink-dim:rgba(233,255,245,.62);
  --glass:rgba(0,0,0,.5);
  --font-display:'Orbitron','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#03040a;color:var(--ink);font-family:var(--font-mono);overflow:hidden;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

.glass{
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,0) 42%),var(--glass);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--neon);border-radius:1rem;
  box-shadow:0 0 0 1px rgba(0,255,136,.10) inset,0 0 22px rgba(0,255,136,.26),0 12px 40px rgba(0,0,0,.55);
}
.chip{padding:.55rem .95rem;font-size:12px;letter-spacing:.18em;display:flex;align-items:center;gap:.6rem;white-space:nowrap}
.btn-neon{
  cursor:pointer;border:1px solid var(--neon);border-radius:1rem;padding:.9rem 1.3rem;
  background:rgba(0,255,136,.14);color:var(--neon);font-family:var(--font-display);font-weight:700;letter-spacing:.2em;font-size:13px;
  box-shadow:0 0 18px rgba(0,255,136,.25);transition:transform .15s,box-shadow .2s,background .2s;
}
.btn-neon:hover{background:rgba(0,255,136,.26);box-shadow:0 0 28px rgba(0,255,136,.55);transform:translateY(-1px)}
.btn-neon:active{transform:translateY(1px) scale(.98)}
.btn-neon.ghost{background:transparent;color:var(--ink-dim);box-shadow:none}
.btn-neon.ghost:hover{color:var(--ink);background:rgba(255,255,255,.06)}

#gate{position:fixed;inset:0;z-index:20;overflow:hidden;background:#02050a;touch-action:none;transition:opacity .65s ease,transform .65s ease,filter .65s ease}
#gate.leaving{opacity:0;transform:scale(1.05);filter:blur(10px);pointer-events:none}
#ascii{position:absolute;inset:0;width:100%;height:100%;display:block}
.gate-shade{position:absolute;inset:0;pointer-events:none;
  background:
   radial-gradient(ellipse 58% 52% at 50% 50%,rgba(2,6,10,.80) 0%,rgba(2,6,10,.42) 55%,rgba(2,6,10,0) 100%),
   linear-gradient(to bottom,rgba(2,5,10,.55),transparent 22%,transparent 72%,rgba(2,5,10,.7));}
.gate-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,3.2vh,30px);padding:24px;pointer-events:none}
.gate-content>*{pointer-events:auto}
.eyebrow{font-size:12px;letter-spacing:.55em;padding:.6rem 1.1rem .6rem 1.65rem;color:var(--neon);text-shadow:0 0 12px rgba(0,255,136,.8);animation:rise .9s cubic-bezier(.2,.9,.2,1) both}
.title{
  margin:0;text-align:center;font-family:var(--font-display);font-weight:900;line-height:.95;letter-spacing:.05em;
  font-size:clamp(28px,7.4vw,104px);
  background:linear-gradient(100deg,#fff 0%,#c9ffe6 22%,#00ff88 48%,#00ffff 74%,#fff 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(0,255,136,.5));
  animation:rise 1s .1s cubic-bezier(.2,.9,.2,1) both,sheen 7s linear infinite;
}
.menu{display:flex;flex-direction:column;gap:12px;width:min(88vw,350px)}
.menu>*{animation:rise .7s cubic-bezier(.2,.9,.2,1) both}
.menu>*:nth-child(1){animation-delay:.25s}.menu>*:nth-child(2){animation-delay:.33s}.menu>*:nth-child(3){animation-delay:.41s}.menu>*:nth-child(4){animation-delay:.49s}
.menu-title{font-size:11px;letter-spacing:.4em;text-align:center;color:var(--ink-dim);margin-bottom:2px}
.gbtn{
  position:relative;display:flex;align-items:center;gap:14px;width:100%;cursor:pointer;text-align:left;
  padding:15px 20px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.22em;color:var(--ink);
  transition:transform .18s,box-shadow .25s,background .25s;
}
.gbtn .ico{width:26px;text-align:center;font-size:17px;filter:drop-shadow(0 0 8px rgba(0,255,136,.8))}
.gbtn small{display:block;font-family:var(--font-mono);font-weight:400;font-size:10px;letter-spacing:.14em;color:var(--ink-dim);margin-top:4px}
.gbtn .dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c),inset 0 -3px 5px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.55);flex:none}
.gbtn:hover{transform:translateX(6px);background:linear-gradient(90deg,rgba(0,255,136,.22),rgba(0,255,136,0) 90%),var(--glass);box-shadow:0 0 34px rgba(0,255,136,.5),0 12px 40px rgba(0,0,0,.55)}
.gbtn:active{transform:translateX(3px) scale(.985)}
.gbtn.back{justify-content:center;color:var(--ink-dim);font-size:13px}
.gate-foot{position:absolute;bottom:calc(var(--safe-b) + 18px);left:0;right:0;text-align:center;font-size:10px;letter-spacing:.35em;color:rgba(0,255,136,.55);pointer-events:none}

.subtitle{margin:-6px 0 0;text-align:center;font-size:clamp(11px,2.9vw,14px);letter-spacing:.14em;color:var(--ink-dim);animation:rise .9s .18s cubic-bezier(.2,.9,.2,1) both}
.team{width:min(92vw,440px);display:flex;flex-direction:column;align-items:center;gap:10px;animation:rise .9s .22s cubic-bezier(.2,.9,.2,1) both}
.c-view{width:100%;overflow:hidden;padding:8px 0;cursor:grab;touch-action:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.c-view:active{cursor:grabbing}
.c-track{display:flex;width:max-content;animation:scroll 15s linear infinite}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.m{position:relative;flex:none;width:60px;height:60px;margin-right:12px;border-radius:50%;overflow:hidden;border:2px solid #00ff88;box-shadow:0 0 12px rgba(0,255,136,.35);background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:24px;cursor:pointer}
.m img,.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.c-dots{display:flex;gap:8px;padding:4px 0}
.c-dots i{width:8px;height:8px;border-radius:50%;background:rgba(0,255,136,.25);transition:background .3s,transform .3s,box-shadow .3s;cursor:pointer}
.c-dots i.on{background:var(--neon);box-shadow:0 0 10px var(--neon);transform:scale(1.3)}
.person{text-align:center}
.person .ph{position:relative;width:min(58vw,220px);aspect-ratio:4/5;margin:0 auto 16px;border-radius:1rem;overflow:hidden;border:1px solid var(--neon);box-shadow:0 0 26px rgba(0,255,136,.45);display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:56px;color:var(--neon);background:rgba(0,0,0,.55)}
.person h2{margin:0;font-size:clamp(18px,5vw,24px)}
#game{position:fixed;inset:0;z-index:10;background:#03040a}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#hud{position:absolute;inset:0;pointer-events:none}
#hud button{pointer-events:auto}
.hud-top{position:absolute;top:calc(var(--safe-t) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}
.hud-center{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.hud-btn{cursor:pointer;padding:.62rem .9rem;font-size:11px;letter-spacing:.16em;transition:box-shadow .2s,transform .15s}
.hud-btn:hover{box-shadow:0 0 30px rgba(0,255,136,.55)}
.hud-btn:active{transform:scale(.96)}
.hud-right{display:flex;gap:8px;align-items:center}
.diff-chip{padding:.62rem .85rem;font-size:11px;letter-spacing:.16em}
.diff-chip i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);display:block}

.timer{
  gap:12px;padding:.5rem 1.35rem;font-family:var(--font-display);font-weight:700;font-size:clamp(22px,5.4vw,30px);letter-spacing:.12em;
  border-radius:1.15rem;border-width:1.5px;
  box-shadow:0 0 0 1px rgba(0,255,136,.12) inset,0 0 0 4px rgba(0,0,0,.35),0 0 0 5px rgba(0,255,136,.28),0 0 30px rgba(0,255,136,.35),0 12px 36px rgba(0,0,0,.6);
  font-variant-numeric:tabular-nums;
}
.timer .tico{font-size:.8em;filter:drop-shadow(0 0 8px rgba(0,255,136,.9))}
.timer .digits{text-shadow:0 0 14px rgba(0,255,136,.85);min-width:3.1em;text-align:center}
.timer.running .tico{animation:tick 1s steps(2) infinite}
.turn{padding:.5rem 1rem;font-size:11px;letter-spacing:.22em;border-color:var(--pc,var(--neon));box-shadow:0 0 22px color-mix(in srgb,var(--pc,#00ff88) 55%,transparent),0 0 0 1px rgba(255,255,255,.05) inset,0 8px 28px rgba(0,0,0,.5);transition:border-color .35s,box-shadow .35s}
.turn .pd{width:12px;height:12px;border-radius:50%;background:var(--pc);box-shadow:0 0 14px var(--pc),0 0 4px var(--pc);animation:pulse 1.3s ease-in-out infinite}
.turn b{color:var(--pc);text-shadow:0 0 10px var(--pc);font-family:var(--font-display);letter-spacing:.2em}
.hud-bottom{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 16px);display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .25s,transform .25s}
#game.asking .hud-bottom{opacity:0;transform:translateY(20px)}
.hint{font-size:11px;letter-spacing:.3em;color:var(--neon);padding:.5rem 1rem;animation:pulse 1.8s ease-in-out infinite;transition:opacity .25s}
.hint.off{opacity:0}
.pos{padding:.65rem 1.1rem;gap:.9rem;font-size:13px;letter-spacing:.08em;font-variant-numeric:tabular-nums;flex-wrap:nowrap}
.pos .seg{display:flex;flex-direction:column;gap:5px;min-width:96px;opacity:.6;transition:opacity .3s}
.pos .seg.active{opacity:1}
.pos .row{display:flex;align-items:center;gap:7px}
.pos .row i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.pos .row b{color:var(--c);font-weight:800}
.pos .meta{font-size:9px;letter-spacing:.22em;color:var(--ink-dim)}
.pos .bar{display:block;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.pos .bar u{display:block;height:100%;border-radius:4px;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .5s cubic-bezier(.2,.9,.3,1)}
.pos .sep{width:1px;align-self:stretch;background:linear-gradient(transparent,var(--neon),transparent);opacity:.7}

#modalRoot{position:fixed;inset:0;z-index:50;pointer-events:none}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,6,3,.58);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .22s;pointer-events:auto}
.overlay.in{opacity:1}.overlay.out{opacity:0;pointer-events:none}
.overlay.sheet{align-items:flex-end;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;pointer-events:none;padding-bottom:calc(var(--safe-b) + 18px)}
.overlay.sheet .modal{pointer-events:auto}
.modal{width:min(94vw,480px);padding:26px 26px 24px;max-height:88vh;overflow:auto;transform:translateY(16px) scale(.96);transition:transform .3s cubic-bezier(.2,.9,.3,1.25)}
.overlay.in .modal{transform:none}
.modal h2{margin:0 0 18px;font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:.2em;color:var(--neon);text-shadow:0 0 16px rgba(0,255,136,.7)}
.modal .actions{display:flex;gap:10px;margin-top:22px}
.modal .actions .btn-neon{flex:1}
.rule{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid rgba(0,255,136,.18)}
.rule:first-of-type{border-top:0;padding-top:0}
.rule .sw{flex:none;width:26px;height:26px;border-radius:50%;margin-top:2px;background:var(--c);box-shadow:0 0 16px var(--c),0 6px 8px rgba(0,0,0,.45),inset 0 -5px 7px rgba(0,0,0,.3),inset 0 3px 4px rgba(255,255,255,.55);display:grid;place-items:center;font-size:13px}
.rule h3{margin:0 0 4px;font-size:12px;letter-spacing:.2em;color:var(--ink)}
.rule p{margin:0;font-size:12px;line-height:1.6;color:var(--ink-dim)}
.crew{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.crew li{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:.8rem;background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.28);font-size:14px;letter-spacing:.06em}
.crew li span{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#001a0e;background:var(--neon);box-shadow:0 0 14px rgba(0,255,136,.8)}
.crew li.lead{background:rgba(0,255,136,.16);box-shadow:0 0 18px rgba(0,255,136,.22)}
.sub{font-size:11px;letter-spacing:.2em;color:var(--ink-dim);margin:-8px 0 16px}

.q-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;letter-spacing:.2em;color:var(--ink-dim)}
.q-head .pl{display:flex;align-items:center;gap:8px;color:var(--c);font-family:var(--font-display);font-weight:700;letter-spacing:.2em;text-shadow:0 0 10px var(--c)}
.q-head .pl i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.q-text{font-family:var(--font-display);font-weight:700;text-align:center;font-size:clamp(30px,8vw,46px);letter-spacing:.06em;margin:20px 0 18px;text-shadow:0 0 22px rgba(0,255,136,.55);white-space:nowrap;overflow-x:auto}
.q-row{display:flex;gap:10px}
.q-row input{
  flex:1;min-width:0;width:100%;font:800 28px/1 var(--font-mono);text-align:center;color:var(--ink);padding:.7rem .5rem;
  background:rgba(0,0,0,.55);border:1px solid var(--neon);border-radius:1rem;outline:none;box-shadow:0 0 16px rgba(0,255,136,.2) inset;
  -moz-appearance:textfield;-webkit-user-select:text;user-select:text;
}
.q-row input:focus{box-shadow:0 0 22px rgba(0,255,136,.55),0 0 16px rgba(0,255,136,.2) inset}
.q-row input::-webkit-outer-spin-button,.q-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.q-row input::placeholder{color:rgba(233,255,245,.25)}
.q-fb{min-height:22px;margin-top:14px;text-align:center;font-size:13px;letter-spacing:.16em;font-weight:800}
.q-fb.ok{color:var(--neon);text-shadow:0 0 14px var(--neon)}
.q-fb.no{color:var(--red);text-shadow:0 0 14px var(--red)}
.modal.shake{animation:shake .35s}
.modal.flash-ok{box-shadow:0 0 0 1px rgba(0,255,136,.3) inset,0 0 50px rgba(0,255,136,.7),0 12px 40px rgba(0,0,0,.55)}
.modal.flash-no{border-color:var(--red);box-shadow:0 0 0 1px rgba(255,34,68,.3) inset,0 0 50px rgba(255,34,68,.65),0 12px 40px rgba(0,0,0,.55)}

.win{text-align:center}
.win .trophy{font-size:54px;filter:drop-shadow(0 0 18px rgba(0,255,255,.9));animation:float 2.4s ease-in-out infinite}
.win h2{font-size:clamp(22px,6vw,30px);margin:6px 0 4px}
.win .room{font-size:11px;letter-spacing:.35em;color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.win .big{margin:20px auto 6px;display:inline-flex;font-family:var(--font-display);font-weight:900;font-size:clamp(32px,9vw,46px);letter-spacing:.12em;padding:.4rem 1.4rem;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(0,255,136,.9)}
.win .stats{display:flex;justify-content:center;gap:22px;margin-top:14px;font-size:12px;letter-spacing:.1em;color:var(--ink-dim)}
.win .stats b{color:var(--c)}

@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes sheen{to{background-position:-220% 0}}
@keyframes pulse{50%{opacity:.55}}
@keyframes tick{50%{opacity:.35}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@media (max-width:520px){
  .hud-btn span.lbl{display:none}
  .pos{gap:.6rem;padding:.6rem .8rem}.pos .seg{min-width:84px}
  .modal{padding:22px 20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<section id="gate" aria-label="Game gate">
  <canvas id="ascii" aria-hidden="true"></canvas>
  <div class="gate-shade"></div>
  <div class="gate-content">
    <h1 class="title">10-RESILIENCE</h1>
    <p class="subtitle">GAME DEVELOPERS</p>
    <div class="team" id="team" aria-label="Team members"><div class="c-view" id="cView"><div class="c-track" id="cTrack"></div></div></div>

    <nav class="menu" id="menuMain" aria-label="Main menu">
      <button class="gbtn glass" data-action="play"><span class="ico">▶</span><span>PLAY</span></button>
      <button class="gbtn glass" data-action="mechanics"><span class="ico">📜</span><span>MECHANICS</span></button>

    </nav>

    <nav class="menu" id="menuDiff" aria-label="Select difficulty" hidden>
      <div class="menu-title">SELECT DIFFICULTY</div>
      <button class="gbtn glass" data-action="diff" data-diff="easy"><span class="dot" style="--c:#00ff88"></span><span>EASY<small>SIMPLYFIYING RADICAL EXPRESSION</small></span></button>
      <button class="gbtn glass" data-action="diff" data-diff="medium"><span class="dot" style="--c:#ffaa00"></span><span>MEDIUM<small>ABOUT BASIC ADDITION OF RADICAL EXPRESSION</small></span></button>
      <button class="gbtn glass" data-action="diff" data-diff="hard"><span class="dot" style="--c:#ff2244"></span><span>HARD<small>SIMPLYFIYING FIRST</small></span></button>
      <button class="gbtn glass back" data-action="back">BACK</button>
    </nav>
  </div>
  <div class="gate-foot">MOVE YOUR CURSOR TO BEND THE FLOW</div>
</section>

<section id="game" hidden aria-label="Math board game">
  <canvas id="board"></canvas>
  <div id="hud">
    <div class="hud-top">
      <button class="chip glass hud-btn" id="btnMenu" aria-label="Back to menu">⟵ <span class="lbl">MENU</span></button>
      <div class="hud-center">
        <div class="chip glass timer" id="timer" role="timer" aria-label="Elapsed time"><span class="tico">⏱</span><span class="digits" id="timeText">00:00</span></div>
        <div class="chip glass turn" id="turn"><span class="pd"></span><span><b id="turnName">P1</b> TURN</span></div>
      </div>
      <div class="hud-right">
        <div class="chip glass diff-chip" id="diffChip"><i></i><span id="diffText">EASY</span></div>
        <button class="chip glass hud-btn" id="btnSound" aria-label="Toggle sound">🔊</button>
      </div>
    </div>
    <div class="hud-bottom">
      <div class="chip glass hint" id="hint">TAP ANYWHERE TO MOVE</div>
      <div class="chip glass pos" id="pos" aria-live="polite"></div>
    </div>
  </div>
</section>

<div id="modalRoot"></div>

<script>
(() => {
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

const hex2rgb = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (c, to, t) => [lerp(c[0], to[0], t), lerp(c[1], to[1], t), lerp(c[2], to[2], t)];

const COLORS = {
  orange: '#ffaa00', green: '#00ff88', red: '#ff2244', white: '#ffffff', cyan: '#00ffff',
  players: ['#3b9dff', '#ff4dd2'],
};
const TOTAL = 20;
const SECTIONS = 10;
const secOf = pos => pos === 0 ? 0 : Math.ceil(pos / 2);

const BG_URL = '';

const Sfx = (() => {
  let ctx = null, on = true;
  const ensure = () => {

const Ascii = (() => {

function createPools(diff) {

  if (!pool.main.length) pool.main = shuffle(BANKS[G.diff].main);
  const swap = () => { const L = pool.main.length - 1; [pool.main[0], pool.main[L]] = [pool.main[L], pool.main[0]]; };
  const top = () => pool.main[pool.main.length - 1].text;
  if (pool.main.length > 1 && top() === pool.last) swap();

  G.q = drawQuestion(p, tile);
  const col = COLORS.players[p];
  const meta = trial ? `TRIAL ${G.tCount[p] + 1}/3 · NO PENALTY` : tile === TOTAL ? 'ROOM 20 · FINAL' : `SEC ${secOf(tile)} · TILE ${tile}/${TOTAL}`;
  gameEl.classList.add('asking');
  const m = openModal(`
    <div class="q-head"><span class="pl" style="--c:${col}"><i></i>P${p + 1}</span><span>${meta}</span></div>
    <div class="q-text" style="${radical || G.q.placeholder ? 'font-size:clamp(20px,5.6vw,32px)' : ''}">${G.q.text}</div>
    <div class="q-row">${radical ? '<button class="btn-neon ghost" id="root" type="button" aria-label="Insert square root">√</button>' : ''}<input id="ans" type="text" inputmode="${radical ? 'text' : 'numeric'}" placeholder="${G.q.placeholder ? 'tap submit' : '?'}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer"><button class="btn-neon" id="submit">SUBMIT</button></div>
    <div class="q-fb" id="fb" aria-live="assertive"></div>
  `, { sheet: true, dismiss: false });
  const input = $('#ans', m.el), fb = $('#fb', m.el);
  let locked = false;
  const submit = () => {
    if (locked) return;
    if (!G.q.placeholder && input.value.trim() === '') { m.el.classList.remove('shake'); void m.el.offsetWidth; m.el.classList.add('shake'); input.focus(); return; }
    locked = true; input.disabled = true; $('#submit', m.el).disabled = true;
    const ok = checkAnswer(input.value, G.q);
    if (!trial) G.tries[p]++;
    resolveAnswer(ok, p, tile, m, fb);
  };
  $('#submit', m.el).addEventListener('click', submit);
  const rb = $('#root', m.el);
  if (rb) rb.addEventListener('click', () => {
    const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? s;
    input.value = input.value.slice(0, s) + '√' + input.value.slice(e); input.focus(); input.setSelectionRange(s + 1, s + 1);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  setTimeout(() => input.focus({ preventScroll: true }), 320);
}

function resolveAnswer(ok, p, tile, m, fb) {
  if (tile === null) { resolveTrial(ok, p, m, fb); return; }
  G.state = 'feedback';
  const t = G.tiles[tile];
  if (ok) {
    G.correct[p]++; t.state = 'ok';
    m.el.classList.add('flash-ok'); fb.className = 'q-fb ok'; fb.textContent = '✔ CORRECT';
    burst(t.x, t.y, COLORS.green, 26, 220, 60); Sfx.ok();
    if (tile === TOTAL) { later(() => { m.close(); gameEl.classList.remove('asking'); win(p); }, 800); return; }
    later(() => { m.close(); gameEl.classList.remove('asking'); nextTurn(); }, 850);
  } else {
    t.state = 'bad';
    m.el.classList.add('flash-no', 'shake'); fb.className = 'q-fb no'; fb.textContent = `✖ WRONG — ANSWER ${G.q.answer} · BACK 1 TILE`;
    burst(t.x, t.y, COLORS.red, 26, 220, 60); Sfx.bad();
    later(() => { m.close(); gameEl.classList.remove('asking'); }, 1500);
    later(() => {
      const from = G.pos[p], to = Math.max(0, from - 1);
      hop(p, from, to, () => {
        G.pos[p] = to; t.state = 'default';
        burst(G.tiles[to].x, G.tiles[to].y, COLORS.players[p], 8, 90, 0);
        nextTurn();
      }, 560);
    }, 1750);
  }
}

function nextTurn() { G.cur = 1 - G.cur; G.state = 'idle'; updateHud(); }

function win(p) {
  G.state = 'won'; G.endTime = performance.now(); updateHud(); updateTimer(true);
  Sfx.win();
  const room = G.tiles[TOTAL];
  const sidAtWin = G.sid;
  const rain = setInterval(() => {
    if (G.sid !== sidAtWin) { clearInterval(rain); return; }
    for (let k = 0; k < 2; k++) burst(room.x + (Math.random() - .5) * 280, room.y - 40 - Math.random() * 120, pick(['#00ff88', '#00ffff', '#ffaa00', '#ff4dd2', '#3b9dff', '#ffffff']), 10, 160, 120);
  }, 220);
  setTimeout(() => clearInterval(rain), 4200);
  const time = fmtTime(elapsed());
  later(() => {
    const col = COLORS.players[p];
    const m = openModal(`
      <div class="win">
        <div class="trophy">🏆</div>
        <h2 style="color:${col};text-shadow:0 0 18px ${col}">P${p + 1} WINS</h2>
        <div class="room">ROOM 20 REACHED</div>
        <div class="glass big"><span>⏱&nbsp;${time}</span></div>
        <div class="stats"><span>P1 <b style="color:${COLORS.players[0]}">${G.correct[0]}/${G.tries[0]}</b></span><span>P2 <b style="color:${COLORS.players[1]}">${G.correct[1]}/${G.tries[1]}</b></span><span>${DIFFS[G.diff].label}</span></div>
        <div class="actions"><button class="btn-neon" id="replay">▶ REPLAY</button><button class="btn-neon ghost" id="toMenu">MENU</button></div>
      </div>`, { dismiss: false });
    $('#replay', m.el).addEventListener('click', () => { Sfx.click(); const d = G.diff; m.close(); setTimeout(() => startGame(d), 60); });
    $('#toMenu', m.el).addEventListener('click', () => { Sfx.click(); m.close(); backToGate(); });
  }, 1100);
}

const fmtTime = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const elapsed = () => G.startTime === null ? 0 : ((G.endTime ?? performance.now()) - G.startTime);
function updateTimer(force) {
  const s = fmtTime(elapsed());
  if (force || s !== G.lastTimeStr) { G.lastTimeStr = s; $('#timeText').textContent = s; }
  $('#timer').classList.toggle('running', G.startTime !== null && G.endTime === null);
}
function updateHud() {
  const col = COLORS.players[G.cur];
  $('#turn').style.setProperty('--pc', col);
  $('#turnName').textContent = 'P' + (G.cur + 1);
  $('#hint').classList.toggle('off', G.state !== 'idle');
  $('#hint').textContent = G.phase === 'trial' ? 'TRIAL · TAP TO ANSWER' : 'TAP ANYWHERE TO MOVE';
  const seg = p => {
    const pos = G.pos[p], c = COLORS.players[p];
    return `<div class="seg ${G.cur === p && G.state !== 'won' ? 'active' : ''}" style="--c:${c}">
      <div class="row"><i></i><span>P${p + 1}: <b>${pos}/${TOTAL}</b></span></div>
      <span class="bar"><u style="width:${pos / TOTAL * 100}%"></u></span>
      <span class="meta">${pos === 0 ? 'START' : pos === TOTAL ? 'ROOM 20' : 'SEC ' + secOf(pos) + '/' + SECTIONS}</span>
    </div>`;
  };
  const posEl = $('#pos');

  if (!posEl.firstChild) posEl.innerHTML = seg(0) + '<span class="sep"></span>' + seg(1);
  else { const segs = posEl.querySelectorAll('.seg'); [0, 1].forEach(p => {
    const el = segs[p], pos = G.pos[p];
    el.classList.toggle('active', G.cur === p && G.state !== 'won');
    el.querySelector('.row b').textContent = `${pos}/${TOTAL}`;
    el.querySelector('.bar u').style.width = `${pos / TOTAL * 100}%`;
    el.querySelector('.meta').textContent = pos === 0 ? 'START' : pos === TOTAL ? 'ROOM 20' : 'SEC ' + secOf(pos) + '/' + SECTIONS;
  }); }
}

function burst(x, y, color, n = 16, speed = 160, up = 0) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = speed * (.35 + Math.random() * .75);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - up, life: 0, max: .6 + Math.random() * .7, c: color, s: 1.6 + Math.random() * 3 });
  }
}

function resizeBoard() {
  G.dpr = Math.min(window.devicePixelRatio || 1, 2);
  G.W = innerWidth; G.H = innerHeight;
  board.width = (G.W * G.dpr) | 0; board.height = (G.H * G.dpr) | 0;
  G.zoom = clamp(Math.min(G.W, G.H) / 620, .74, 1);
}
window.addEventListener('resize', () => { if (G.running) resizeBoard(); });

function playerPos(p, now) {
  const a = G.anim;
  if (a && a.p === p) {
    const u = clamp((now - a.t0) / a.dur, 0, 1), e = easeInOut(u), A = G.tiles[a.from], B = G.tiles[a.to];
    return { x: lerp(A.x, B.x, e), y: lerp(A.y, B.y, e), lift: Math.sin(u * Math.PI) * 38 };
  }
  const t = G.tiles[G.pos[p]]; return { x: t.x, y: t.y, lift: 0 };
}

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function update(now, dt) {

  if (G.anim) { const a = G.anim; if (now - a.t0 >= a.dur) { G.anim = null; a.done && a.done(); } }

  const f = 1 - Math.pow(1 - .09, dt * 60);
  const tgt = playerPos(G.cur, now);
  G.cam.x += (tgt.x - G.cam.x) * f; G.cam.y += (tgt.y - G.cam.y) * f;
  G.qShift += ((G.state === 'question' || G.state === 'feedback' ? G.H * .2 : 0) - G.qShift) * (1 - Math.pow(.88, dt * 60));

  G.tiles.forEach((t, i) => {
    const active = G.state !== 'won' && G.pos[G.cur] === i;
    t.r += ((active ? 26 : 19) - t.r) * (1 - Math.pow(.8, dt * 60));
    const target = hex2rgb(t.state === 'ok' ? COLORS.green : t.state === 'bad' ? COLORS.red : baseColorFor(i));
    const k = 1 - Math.pow(.82, dt * 60);
    t.col = [lerp(t.col[0], target[0], k), lerp(t.col[1], target[1], k), lerp(t.col[2], target[2], k)];
  });
  for (const p of G.tok) p.ox += (((G.pos[0] === G.pos[1]) ? (p === G.tok[0] ? -14 : 14) : 0) - p.ox) * (1 - Math.pow(.8, dt * 60));

  for (let i = G.parts.length - 1; i >= 0; i--) {
    const q = G.parts[i]; q.life += dt;
    if (q.life > q.max) { G.parts.splice(i, 1); continue; }
    q.vy += 380 * dt; q.vx *= 1 - .8 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
  }
}

function drawBackground(ctx, now) {
  const W = G.W, H = G.H;
  if (!G.bgPattern) G.bgPattern = ctx.createPattern(bgCanvas, 'repeat');
  const ox = -G.cam.x * .07, oy = -G.cam.y * .07;
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.save(); ctx.translate(ox, oy); ctx.fillStyle = G.bgPattern; ctx.fillRect(-ox, -oy, W, H); ctx.restore();

  for (const d of G.dust) {
    const x = ((d.x * W - G.cam.x * d.p * 2 + now * .004 * d.s) % W + W) % W;
    const y = ((d.y * H - G.cam.y * d.p * 2 - now * .006 * d.s) % H + H) % H;
    ctx.fillStyle = `rgba(150,255,220,${d.a * (.6 + .4 * Math.sin(now * .002 + d.x * 20))})`; ctx.beginPath(); ctx.arc(x, y, d.s, 0, TAU); ctx.fill();
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

function drawPath(ctx, now) {
  const T = G.tiles;
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(T[0].x, T[0].y); for (let i = 1; i < T.length; i++) ctx.lineTo(T[i].x, T[i].y);
  ctx.setLineDash([]); ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 74; ctx.stroke();
  ctx.strokeStyle = 'rgba(0,255,136,.07)'; ctx.lineWidth = 56; ctx.stroke();
  ctx.setLineDash([11, 13]); ctx.lineDashOffset = -(now / 1000) * 42;
  ctx.shadowColor = 'rgba(255,255,255,.9)'; ctx.shadowBlur = 9; ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();
}

function drawTile(ctx, t, i, now, active) {
  const r = t.r, c = t.col;

  const sy = t.y + r * .78 + 7, sg = ctx.createRadialGradient(t.x, sy, 0, t.x, sy, r * 1.15);
  sg.addColorStop(0, 'rgba(0,0,0,.6)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.translate(t.x, sy); ctx.scale(1, .36); ctx.translate(-t.x, -sy); ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(t.x, sy, r * 1.15, 0, TAU); ctx.fill(); ctx.restore();

  ctx.save();
  ctx.shadowColor = rgb(c, .95); ctx.shadowBlur = active ? 42 : 15; ctx.shadowOffsetY = active ? 0 : 3;
  const g = ctx.createRadialGradient(t.x - r * .34, t.y - r * .4, r * .05, t.x, t.y, r * 1.12);
  g.addColorStop(0, rgb(mix(c, [255, 255, 255], .62))); g.addColorStop(.42, rgb(c)); g.addColorStop(1, rgb(mix(c, [0, 0, 0], .5)));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.lineWidth = active ? 2.6 : 1.8; ctx.strokeStyle = active ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.arc(t.x, t.y, r - 1, 0, TAU); ctx.stroke();
  ctx.save(); ctx.translate(t.x - r * .22, t.y - r * .5); ctx.rotate(-.35); ctx.fillStyle = 'rgba(255,255,255,.34)'; ctx.beginPath(); ctx.ellipse(0, 0, r * .46, r * .2, 0, 0, TAU); ctx.fill(); ctx.restore();

  if (active) {
    const pu = (Math.sin(now / 320) + 1) / 2;
    ctx.strokeStyle = rgb(c, .55 - pu * .3); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(t.x, t.y, r + 8 + pu * 6, 0, TAU); ctx.stroke();
  }
}

function drawLabel(ctx, text, x, y, color) {
  ctx.save();
  ctx.font = '700 11px "JetBrains Mono", ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '1.6px';
  const w = ctx.measureText(text).width + 22, h = 22, x0 = x - w / 2, y0 = y - h / 2;
  rr(ctx, x0, y0, w, h, 11); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = color; ctx.globalAlpha = .75; ctx.shadowColor = color; ctx.shadowBlur = 8; ctx.stroke();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.fillStyle = color; ctx.fillText(text, x + 1, y + 1);
  ctx.restore();
}

function drawToken(ctx, p, now) {
  const pp = playerPos(p, now), col = COLORS.players[p], rgbc = hex2rgb(col);
  const cur = G.cur === p && G.state !== 'won';
  const ox = G.tok[p].ox, R = cur ? 12 : 10;
  const bob = (G.anim && G.anim.p === p) ? 0 : Math.sin(now / 260 + p * 2) * (cur ? 3 : 1.5);
  const cx = pp.x + ox, cy = pp.y - 20 - pp.lift + bob;
  const tileY = pp.y;

  ctx.save(); ctx.fillStyle = `rgba(0,0,0,${.4 - pp.lift / 160})`; ctx.beginPath(); ctx.ellipse(cx, tileY + 2, R * (1 - pp.lift / 120), R * .38, 0, 0, TAU); ctx.fill(); ctx.restore();

  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = cur ? 24 : 12;
  const g = ctx.createRadialGradient(cx - R * .35, cy - R * .4, 1, cx, cy, R * 1.15);
  g.addColorStop(0, rgb(mix(rgbc, [255, 255, 255], .65))); g.addColorStop(.5, col); g.addColorStop(1, rgb(mix(rgbc, [0, 0, 0], .5)));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0; ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.stroke();
  ctx.fillStyle = '#04101a'; ctx.font = `800 ${cur ? 11 : 9}px "JetBrains Mono", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('P' + (p + 1), cx, cy + .5);
  ctx.restore();

  if (cur && G.state === 'idle') {
    const by = cy - R - 12 + Math.sin(now / 220) * 3;
    ctx.save(); ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(cx - 7, by - 6); ctx.lineTo(cx + 7, by - 6); ctx.lineTo(cx, by + 5); ctx.closePath(); ctx.fill(); ctx.restore();
  }
}

function render(now) {
  const ctx = bctx;
  drawBackground(ctx, now);

  const z = G.zoom, d = G.dpr;
  ctx.setTransform(d * z, 0, 0, d * z, d * (G.W / 2 - G.cam.x * z), d * (G.H / 2 - G.qShift - G.cam.y * z));
  drawPath(ctx, now);

  const activeIdx = G.state === 'won' ? -1 : G.pos[G.cur];
  G.tiles.forEach((t, i) => { if (i !== activeIdx) drawTile(ctx, t, i, now, false); });
  if (activeIdx >= 0) drawTile(ctx, G.tiles[activeIdx], activeIdx, now, true);

  G.tiles.forEach((t, i) => {
    if (i === 0) drawLabel(ctx, 'START', t.x, t.y + 52, 'rgba(255,255,255,.9)');
    else if (i === TOTAL) drawLabel(ctx, 'ROOM 20', t.x, t.y + 52, '#00ffff');
    else if (i % 2 === 1) drawLabel(ctx, 'SEC ' + secOf(i), t.x, t.y + 52, '#00ff88');
  });

  drawToken(ctx, 1 - G.cur, now); drawToken(ctx, G.cur, now);

  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const q of G.parts) {
    const a = 1 - q.life / q.max; ctx.globalAlpha = a; ctx.fillStyle = q.c; ctx.shadowColor = q.c; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.s * a + .4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function loop(now) {
  if (!G.running) return;
  G.raf = requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - G.last) / 1000); G.last = now;
  update(now, dt); render(now); updateTimer(false);
}

board.addEventListener('pointerdown', e => { e.preventDefault(); handleTap(); });
window.addEventListener('keydown', e => {
  if (gameEl.hidden || modalOpen()) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); handleTap(); }
});
$('#btnMenu').addEventListener('click', () => {
  Sfx.click();
  if (G.state === 'won' || modalOpen()) { if (G.state === 'won') backToGate(); return; }
  const m = openModal(`
    <h2>LEAVE GAME?</h2>
    <p style="margin:0;font-size:13px;line-height:1.7;color:var(--ink-dim)">Your current race and timer will be lost.</p>
    <div class="actions"><button class="btn-neon ghost" data-close>KEEP PLAYING</button><button class="btn-neon" id="leave">LEAVE</button></div>`);
  $('#leave', m.el).addEventListener('click', () => { m.close(); backToGate(); });
});
$('#btnSound').addEventListener('click', e => { Sfx.unlock(); const on = Sfx.toggle(); e.currentTarget.textContent = on ? '🔊' : '🔇'; if (on) Sfx.click(); });

Ascii.start();
showMenu('main');
initTeam();
})();
</script>
</body>
</html>
